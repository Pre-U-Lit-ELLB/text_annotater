<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Close Reading Annotator — Prose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Dark warm palette ── */
  --bg:          #1e1c18;
  --surface:     #26231e;
  --surface-2:   #2e2b25;
  --border:      #3a362e;
  --border2:     #4d4840;
  --text:        #e8e2d8;
  --text-2:      #9e978d;
  --text-3:      #5e5a54;
  --accent:      #c8a96e;
  --accent-dim:  rgba(200,169,110,0.12);
  --info-bg:     rgba(80,110,180,0.18);
  --info-text:   #8baee8;
  --danger:      #c97060;
  --radius:      7px;
  --font-body:   'DM Sans', sans-serif;
  --font-prose:  'Libre Baskerville', serif;
  --font-mono:   'Courier New', monospace;

  /* voice tag colours */
  --v-ds:    rgba(100,180,240,0.18);
  --v-ds-b:  #5aaad8;
  --v-fid:   rgba(200,150,80,0.18);
  --v-fid-b: #c89650;
  --v-auth:  rgba(160,200,130,0.18);
  --v-auth-b:#7ab860;
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text);
  font-size: 14px;
}

/* ═══════════════════════════════════════
   APP SHELL — default (standalone)
═══════════════════════════════════════ */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  width: 100vw;
}
.body {
  display: grid;
  grid-template-columns: 1fr 290px;
  min-height: 0;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   IFRAME MODE overrides
   Added to <html> by JS when embedded
═══════════════════════════════════════ */
html.iframe-mode .body {
  grid-template-columns: 1fr;
}
html.iframe-mode .sidebar {
  display: none;
}
html.iframe-mode .fab {
  display: flex;
}
html.iframe-mode .drawer {
  display: flex;
}

/* ── TOOLBAR ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.title-block { flex: 1; min-width: 120px; }
.title-block .ex-title  { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
.title-block .ex-author { font-size: 11px; color: var(--text-2); }

.sep { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

.swatch {
  width: 19px; height: 19px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  outline: none; transition: transform 0.1s; flex-shrink: 0;
  opacity: 0.85;
}
.swatch:hover { transform: scale(1.2); opacity: 1; }
.swatch.on { border-color: var(--text); opacity: 1; }

.tbtn {
  font-size: 11px; padding: 4px 9px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  font-family: var(--font-body);
  transition: background 0.1s, color 0.1s;
  white-space: nowrap;
}
.tbtn:hover { background: var(--border); color: var(--text); }
.tbtn.on { background: var(--info-bg); color: var(--info-text); border-color: rgba(100,140,220,0.4); }
.tbtn:disabled { opacity: 0.35; cursor: not-allowed; }
.cat-label { font-size: 11px; color: var(--text-3); white-space: nowrap; }

/* voice mode toggle group */
.voice-group {
  display: flex;
  align-items: center;
  gap: 3px;
}
.vtag-btn {
  font-size: 10px; padding: 3px 7px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  font-family: var(--font-body);
  transition: opacity 0.1s;
  opacity: 0.7;
}
.vtag-btn:hover { opacity: 1; }
.vtag-btn.on { opacity: 1; border-color: currentColor; }
.vtag-btn[data-v="ds"]   { background: var(--v-ds);   color: var(--v-ds-b); }
.vtag-btn[data-v="fid"]  { background: var(--v-fid);  color: var(--v-fid-b); }
.vtag-btn[data-v="auth"] { background: var(--v-auth); color: var(--v-auth-b); }

/* ── TEXT PANE ── */
.text-pane {
  overflow-y: auto;
  padding: 28px 32px 48px 24px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  position: relative;
}
html.iframe-mode .text-pane {
  border-right: none;
  padding: 20px 20px 80px 16px;
}

/* paragraph row: marker | text | margin-note-toggle */
.para-row {
  display: grid;
  grid-template-columns: 24px 1fr 22px;
  gap: 12px;
  margin-bottom: 16px;
  position: relative;
}
.para-row:last-child { margin-bottom: 0; }

.pm {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-3);
  user-select: none;
  text-align: right;
  padding-top: 5px;
  line-height: 1;
  flex-shrink: 0;
}

.pt {
  font-family: var(--font-prose);
  font-size: 15px;
  line-height: 1.88;
  color: var(--text);
  cursor: text;
}

/* sentence focus */
.pt .sentence { cursor: pointer; border-radius: 2px; }
.text-pane.focus-mode .pt .sentence { opacity: 0.2; transition: opacity 0.15s; }
.text-pane.focus-mode .pt .sentence.focused { opacity: 1; }

/* margin note toggle button */
.note-toggle {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text-3);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-top: 4px;
  transition: background 0.1s, color 0.1s;
  flex-shrink: 0;
  line-height: 1;
}
.note-toggle:hover, .note-toggle.has-note { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* inline margin note textarea */
.para-note {
  display: none;
  grid-column: 2 / 4;
  margin-top: -8px;
  margin-bottom: 4px;
}
.para-note.open { display: block; }
.para-note textarea {
  width: 100%;
  background: var(--accent-dim);
  border: 1px solid var(--border2);
  border-left: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 7px 10px;
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  resize: none;
  outline: none;
  min-height: 52px;
}
.para-note textarea::placeholder { color: var(--text-3); }

/* section break */
.section-break {
  height: 20px; display: flex; align-items: center;
  padding-left: 36px; margin-bottom: 16px;
}
.section-break div { width: 40px; height: 1px; background: var(--border2); }

/* highlights */
mark.hl {
  border-radius: 3px; padding: 1px 0;
  cursor: pointer; position: relative;
}
mark.hl:hover::after {
  content: attr(data-cat);
  position: fixed;
  font-size: 10px; font-family: var(--font-body);
  background: var(--surface-2);
  border: 1px solid var(--border2);
  color: var(--text-2);
  padding: 3px 7px; border-radius: 5px;
  white-space: nowrap; pointer-events: none; z-index: 200;
}

/* voice tags */
.vt {
  border-radius: 3px; padding: 1px 0;
  cursor: pointer; position: relative;
}
.vt::before {
  content: attr(data-label);
  position: absolute; bottom: 100%; left: 0;
  font-size: 9px; font-family: var(--font-body);
  padding: 1px 4px; border-radius: 3px;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.1s;
}
.vt:hover::before { opacity: 1; }
.vt[data-v="ds"]   { background: var(--v-ds);   border-bottom: 1.5px solid var(--v-ds-b); }
.vt[data-v="ds"]::before   { background: var(--v-ds);   color: var(--v-ds-b); }
.vt[data-v="fid"]  { background: var(--v-fid);  border-bottom: 1.5px solid var(--v-fid-b); }
.vt[data-v="fid"]::before  { background: var(--v-fid);  color: var(--v-fid-b); }
.vt[data-v="auth"] { background: var(--v-auth); border-bottom: 1.5px solid var(--v-auth-b); }
.vt[data-v="auth"]::before { background: var(--v-auth); color: var(--v-auth-b); }

/* glossary underline */
.gw {
  border-bottom: 1.5px dashed var(--border2);
  cursor: help;
}

/* ── SIDEBAR (standalone) ── */
.sidebar {
  display: grid;
  grid-template-rows: auto auto 1fr auto auto;
  min-height: 0;
  background: var(--bg);
  overflow: hidden;
}

.panel {
  border-bottom: 1px solid var(--border);
  padding: 11px 13px;
  background: var(--surface);
  overflow: hidden;
}
.panel.grow {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel-head {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 7px; flex-shrink: 0;
}
.panel-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-3); font-weight: 500;
}
.panel-action {
  font-size: 10px; padding: 2px 6px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: transparent; color: var(--text-3);
  cursor: pointer; font-family: var(--font-body);
}
.panel-action:hover { color: var(--text); border-color: var(--text-2); }

.key-grid { display: flex; flex-direction: column; gap: 4px; }
.key-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
.key-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.key-section { font-size: 10px; color: var(--text-3); margin-top: 6px; margin-bottom: 3px; }

.notes-ta {
  flex: 1; width: 100%; resize: none;
  border: none; outline: none;
  font-family: var(--font-body);
  font-size: 12px; line-height: 1.7;
  color: var(--text); background: transparent; min-height: 0;
}
.notes-ta::placeholder { color: var(--text-3); }

.log-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 150px; overflow-y: auto;
}
.log-item {
  font-size: 11px; padding: 5px 8px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border-left: 3px solid;
}
.log-q { font-style: italic; font-family: var(--font-prose); font-size: 11px; color: var(--text); margin-bottom: 2px; }
.log-c { font-size: 10px; color: var(--text-2); }
.log-empty { font-size: 11px; color: var(--text-3); font-style: italic; }

.gloss-head {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 7px;
}
.gloss-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 160px; overflow-y: auto;
}
.gloss-entry { font-size: 11px; line-height: 1.5; }
.gloss-term { font-weight: 500; color: var(--text); }
.gloss-def  { color: var(--text-2); }
.gloss-empty { font-size: 11px; color: var(--text-3); font-style: italic; }

/* ── DRAWER (iframe mode) ── */
.fab {
  display: none;
  position: fixed; bottom: 18px; right: 18px; z-index: 100;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); color: var(--bg);
  border: none; cursor: pointer;
  font-size: 18px; align-items: center; justify-content: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}
.fab:hover { transform: scale(1.08); }

.drawer {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 55vh; min-height: 280px;
  background: var(--surface);
  border-top: 1px solid var(--border2);
  border-radius: 14px 14px 0 0;
  z-index: 99;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
}
.drawer.open { transform: translateY(0); }

.drawer-handle {
  display: flex; align-items: center; justify-content: center;
  padding: 10px; flex-shrink: 0; cursor: pointer;
}
.drawer-handle div {
  width: 36px; height: 4px;
  border-radius: 2px; background: var(--border2);
}

.drawer-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}
.dtab {
  font-size: 11px; padding: 7px 14px;
  border: none; background: transparent;
  color: var(--text-2); cursor: pointer;
  font-family: var(--font-body);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.1s;
}
.dtab.on { color: var(--accent); border-bottom-color: var(--accent); }
.dtab:hover { color: var(--text); }

.drawer-body { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 0; }
.drawer-panel { display: none; }
.drawer-panel.on { display: block; }

/* ── TOOLTIP ── */
#tip {
  position: fixed;
  background: var(--surface-2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 6px 10px; font-size: 12px;
  max-width: 230px; z-index: 999;
  pointer-events: none; display: none;
  color: var(--text-2);
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
#tip strong { display: block; color: var(--text); margin-bottom: 2px; font-size: 12px; }

/* scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div id="tip"><strong id="tip-term"></strong><span id="tip-def"></span></div>

<div class="app">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="title-block">
      <div class="ex-title"  id="tb-title"></div>
      <div class="ex-author" id="tb-author"></div>
    </div>
    <div class="sep"></div>
    <span class="cat-label">Highlight:</span>
    <div id="swatches" style="display:flex;gap:4px;align-items:center;"></div>
    <div class="sep"></div>
    <span class="cat-label">Voice:</span>
    <div class="voice-group">
      <button class="vtag-btn" data-v="ds"   title="Direct Speech">DS</button>
      <button class="vtag-btn" data-v="fid"  title="Free Indirect Discourse">FID</button>
      <button class="vtag-btn" data-v="auth" title="Authorial Narration">AN</button>
    </div>
    <div class="sep"></div>
    <button class="tbtn" id="erase-btn">Erase</button>
    <button class="tbtn" id="focus-btn">Sentence focus</button>
    <button class="tbtn" id="clear-btn">Clear all</button>
    <div class="sep"></div>
    <button class="tbtn" id="download-btn">Download PNG</button>
  </div>

  <!-- MAIN BODY -->
  <div class="body">
    <div class="text-pane" id="text-pane"></div>

    <!-- SIDEBAR (standalone) -->
    <div class="sidebar" id="sidebar">

      <div class="panel">
        <div class="panel-label" style="margin-bottom:7px;">Annotation key</div>
        <div class="key-grid" id="key-grid"></div>
      </div>

      <div class="panel grow">
        <div class="panel-head">
          <span class="panel-label">Notes</span>
          <button class="panel-action" id="clear-notes">clear</button>
        </div>
        <textarea class="notes-ta" id="notes" placeholder="Observations, patterns, draft response…"></textarea>
      </div>

      <div class="panel">
        <div class="panel-label" style="margin-bottom:7px;">Highlights log</div>
        <div class="log-list" id="log-list"><span class="log-empty">No highlights yet.</span></div>
      </div>

      <div class="panel">
        <div class="gloss-head">
          <span class="panel-label">Glossary</span>
        </div>
        <div class="gloss-list" id="gloss-list"><span class="gloss-empty">—</span></div>
      </div>

    </div>
  </div>
</div>

<!-- FAB (iframe mode only) -->
<button class="fab" id="fab" title="Open notes &amp; tools">≡</button>

<!-- DRAWER (iframe mode only) -->
<div class="drawer" id="drawer">
  <div class="drawer-handle" id="drawer-handle"><div></div></div>
  <div class="drawer-tabs">
    <button class="dtab on" data-tab="key">Key</button>
    <button class="dtab" data-tab="notes">Notes</button>
    <button class="dtab" data-tab="log">Highlights</button>
    <button class="dtab" data-tab="gloss">Glossary</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-panel on" id="dp-key"></div>
    <div class="drawer-panel" id="dp-notes">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="panel-label">Notes</span>
        <button class="panel-action" id="clear-notes-d">clear</button>
      </div>
      <textarea class="notes-ta" id="notes-d" placeholder="Observations, patterns, draft response…" style="min-height:140px;border:1px solid var(--border2);border-radius:var(--radius);padding:8px;display:block;width:100%;"></textarea>
    </div>
    <div class="drawer-panel" id="dp-log">
      <div class="log-list" id="log-list-d"><span class="log-empty">No highlights yet.</span></div>
    </div>
    <div class="drawer-panel" id="dp-gloss">
      <div class="gloss-list" id="gloss-list-d"><span class="gloss-empty">—</span></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  CONFIG — swap for each SLS module
//  lines: each paragraph as one string. null = section break.
//  glossary: {} to omit, or add "term": "definition" pairs.
// ═══════════════════════════════════════════════════════════════════════
const EXCERPT = {
  title: "Frankenstein",
  author: "Mary Shelley (1818)",
  lines: [
    "I spent the following day roaming through the valley. I stood beside the sources of the Arveiron, which take their rise in a glacier, that with slow pace is advancing down from the summit of the hills to barricade the valley. The abrupt sides of vast mountains were before me; the icy wall of the glacier overhung me; a few shattered pines were scattered around; and the solemn silence of this glorious presence-chamber of imperial Nature was broken only by the brawling waves or the fall of some vast fragment, the thunder sound of the avalanche or the cracking, reverberated along the mountains, of the accumulated ice, which, through the silent working of immutable laws, was ever and anon rent and torn, as if it had been but a plaything in their hands. These sublime and magnificent scenes afforded me the greatest consolation that I was capable of receiving. They elevated me from all littleness of feeling, and although they did not remove my grief, they subdued and tranquillised it. In some degree, also, they diverted my mind from the thoughts over which it had brooded for the last month. I retired to rest at night; my slumbers, as it were, waited on and ministered to by the assemblance of grand shapes which I had contemplated during the day. They congregated round me; the unstained snowy mountain-top, the glittering pinnacle, the pine woods, and ragged bare ravine, the eagle, soaring amidst the clouds—they all gathered round me and bade me be at peace.",
    "Where had they fled when the next morning I awoke? All of soul-inspiriting fled with sleep, and dark melancholy clouded every thought. The rain was pouring in torrents, and thick mists hid the summits of the mountains, so that I even saw not the faces of those mighty friends. Still I would penetrate their misty veil and seek them in their cloudy retreats. What were rain and storm to me? My mule was brought to the door, and I resolved to ascend to the summit of Montanvert. I remembered the effect that the view of the tremendous and ever-moving glacier had produced upon my mind when I first saw it. It had then filled me with a sublime ecstasy that gave wings to the soul and allowed it to soar from the obscure world to light and joy. The sight of the awful and majestic in nature had indeed always the effect of solemnising my mind and causing me to forget the passing cares of life. I determined to go without a guide, for I was well acquainted with the path, and the presence of another would destroy the solitary grandeur of the scene.",
    "The ascent is precipitous, but the path is cut into continual and short windings, which enable you to surmount the perpendicularity of the mountain. It is a scene terrifically desolate. In a thousand spots the traces of the winter avalanche may be perceived, where trees lie broken and strewed on the ground, some entirely destroyed, others bent, leaning upon the jutting rocks of the mountain or transversely upon other trees. The path, as you ascend higher, is intersected by ravines of snow, down which stones continually roll from above; one of them is particularly dangerous, as the slightest sound, such as even speaking in a loud voice, produces a concussion of air sufficient to draw destruction upon the head of the speaker. The pines are not tall or luxuriant, but they are sombre and add an air of severity to the scene. I looked on the valley beneath; vast mists were rising from the rivers which ran through it and curling in thick wreaths around the opposite mountains, whose summits were hid in the uniform clouds, while rain poured from the dark sky and added to the melancholy impression I received from the objects around me. Alas! Why does man boast of sensibilities superior to those apparent in the brute; it only renders them more necessary beings. If our impulses were confined to hunger, thirst, and desire, we might be nearly free; but now we are moved by every wind that blows and a chance word or scene that that word may convey to us.",
    null,
    "We rest; a dream has power to poison sleep.",
    "    We rise; one wand'ring thought pollutes the day.",
    "We feel, conceive, or reason; laugh or weep,",
    "    Embrace fond woe, or cast our cares away;",
    "It is the same: for, be it joy or sorrow,",
    "    The path of its departure still is free.",
    "Man's yesterday may ne'er be like his morrow;",
    "    Nought may endure but mutability!",
    null,
    "It was nearly noon when I arrived at the top of the ascent. For some time I sat upon the rock that overlooks the sea of ice. A mist covered both that and the surrounding mountains. Presently a breeze dissipated the cloud, and I descended upon the glacier. The surface is very uneven, rising like the waves of a troubled sea, descending low, and interspersed by rifts that sink deep. The field of ice is almost a league in width, but I spent nearly two hours in crossing it. The opposite mountain is a bare perpendicular rock. From the side where I now stood Montanvert was exactly opposite, at the distance of a league; and above it rose Mont Blanc, in awful majesty. I remained in a recess of the rock, gazing on this wonderful and stupendous scene. The sea, or rather the vast river of ice, wound among its dependent mountains, whose aerial summits hung over its recesses. Their icy and glittering peaks shone in the sunlight over the clouds. My heart, which was before sorrowful, now swelled with something like joy; I exclaimed, \"Wandering spirits, if indeed ye wander, and do not rest in your narrow beds, allow me this faint happiness, or take me, as your companion, away from the joys of life.\""
  ],
  glossary: {
    "Arveiron": "A river in the French Alps fed by glacial meltwater near Chamonix.",
    "sublime": "In Romantic aesthetics, a quality in nature that inspires awe mixed with terror, elevating the soul beyond ordinary experience.",
    "ever and anon": "From time to time; now and then.",
    "Montanvert": "A mountain viewpoint in the French Alps overlooking the Mer de Glace glacier.",
    "awful": "Inspiring awe or reverential fear (older sense, not 'terrible').",
    "solemnising": "Making serious or grave; causing to reflect deeply.",
    "the brute": "Animals; non-human creatures lacking reason or refined feeling.",
    "league": "A unit of distance, approximately three miles.",
    "mutability": "The quality of being subject to change; impermanence.",
  }
};

const CATS = [
  { key:"narration",  label:"Narration",  bg:"rgba(50,170,110,0.25)",  border:"#3ab878" },
  { key:"character",  label:"Character",  bg:"rgba(70,130,230,0.25)",  border:"#5090e8" },
  { key:"language",   label:"Language",   bg:"rgba(210,80,80,0.25)",   border:"#d85858" },
  { key:"structure",  label:"Structure",  bg:"rgba(190,140,40,0.25)",  border:"#c89030" },
  { key:"theme",      label:"Theme",      bg:"rgba(160,80,210,0.25)",  border:"#a858d8" },
];

const VOICE_TAGS = [
  { v:"ds",   label:"Direct Speech",         bg:"var(--v-ds)",   border:"var(--v-ds-b)" },
  { v:"fid",  label:"Free Indirect Disc.",   bg:"var(--v-fid)",  border:"var(--v-fid-b)" },
  { v:"auth", label:"Authorial Narration",   bg:"var(--v-auth)", border:"var(--v-auth-b)" },
];
// ═══════════════════════════════════════════════════════════════════════

let activeCat   = CATS[0].key;
let activeVoice = null;       // null = highlight mode; string = voice tag mode
let eraseMode   = false;
let focusMode   = false;
let anns        = [];
let paraNotes   = {};         // { paraIndex: string }
let glossary    = { ...EXCERPT.glossary };

const textPane = document.getElementById('text-pane');
const logList  = document.getElementById('log-list');
const logListD = document.getElementById('log-list-d');
const glossDiv = document.getElementById('gloss-list');
const glossDivD= document.getElementById('gloss-list-d');
const tip      = document.getElementById('tip');

// ── IFRAME DETECTION ──────────────────────────────────────────────────
const isIframe = window.self !== window.top;
if (isIframe) document.documentElement.classList.add('iframe-mode');

// ── INIT ──────────────────────────────────────────────────────────────
document.getElementById('tb-title').textContent  = EXCERPT.title;
document.getElementById('tb-author').textContent = EXCERPT.author;
buildSwatches();
buildKey();
buildText();
renderGloss();
setupDrawer();
setupVoiceBtns();

// ── SWATCHES ──────────────────────────────────────────────────────────
function buildSwatches() {
  const c = document.getElementById('swatches');
  CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'swatch' + (cat.key === activeCat ? ' on' : '');
    b.style.background = cat.border;
    b.title = cat.label;
    b.dataset.key = cat.key;
    b.onclick = function() {
      activeCat   = this.dataset.key;
      activeVoice = null;
      eraseMode   = false;
      document.getElementById('erase-btn').classList.remove('on');
      document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.key === activeCat));
      document.querySelectorAll('.vtag-btn').forEach(v => v.classList.remove('on'));
    };
    c.appendChild(b);
  });
}

// ── VOICE TAG BUTTONS ─────────────────────────────────────────────────
function setupVoiceBtns() {
  document.querySelectorAll('.vtag-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const v = this.dataset.v;
      if (activeVoice === v) {
        activeVoice = null;
        this.classList.remove('on');
      } else {
        activeVoice = v;
        eraseMode   = false;
        document.getElementById('erase-btn').classList.remove('on');
        document.querySelectorAll('.vtag-btn').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('on'));
        this.classList.add('on');
      }
    });
  });
}

// ── KEY ───────────────────────────────────────────────────────────────
function buildKey() {
  const g = document.getElementById('key-grid');
  g.innerHTML = '';

  const hl = document.createElement('div');
  hl.className = 'key-section';
  hl.textContent = 'Highlights';
  g.appendChild(hl);

  CATS.forEach(cat => {
    const d = document.createElement('div');
    d.className = 'key-item';
    d.innerHTML = `<div class="key-dot" style="background:${cat.border}"></div><span>${cat.label}</span>`;
    g.appendChild(d);
  });

  const vl = document.createElement('div');
  vl.className = 'key-section';
  vl.textContent = 'Voice tags';
  g.appendChild(vl);

  VOICE_TAGS.forEach(vt => {
    const d = document.createElement('div');
    d.className = 'key-item';
    d.innerHTML = `<div class="key-dot" style="background:${vt.border}"></div><span>${vt.label}</span>`;
    g.appendChild(d);
  });

  // mirror into drawer
  const dpKey = document.getElementById('dp-key');
  dpKey.innerHTML = '';
  dpKey.appendChild(g.cloneNode(true));
}

// ── TEXT BUILDING ─────────────────────────────────────────────────────
function glossify(raw) {
  if (!Object.keys(glossary).length) return raw;
  let out = raw;
  Object.keys(glossary).sort((a,b) => b.length - a.length).forEach(term => {
    const def = glossary[term];
    const re = new RegExp(`\\b(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`, 'gi');
    out = out.replace(re, m =>
      `<span class="gw" data-term="${term}" data-def="${def.replace(/"/g,'&quot;')}">${m}</span>`
    );
  });
  return out;
}

// Wrap sentences for sentence-level focus
function sentencify(html) {
  // Split on sentence-ending punctuation followed by space or end of string
  // We operate on the raw text portions only (not inside tags)
  return html.replace(/([^<>]+?)([.!?]["']?\s+|[.!?]["']?$)/g, (match, body, end) => {
    return `<span class="sentence">${body}${end}</span>`;
  });
}

function buildText() {
  textPane.innerHTML = '';
  let n = 0;
  EXCERPT.lines.forEach(line => {
    if (line === null) {
      const br = document.createElement('div');
      br.className = 'section-break';
      br.innerHTML = '<div></div>';
      textPane.appendChild(br);
      return;
    }
    n++;
    const paraIdx = n;

    // Outer row
    const row = document.createElement('div');
    row.className = 'para-row';
    row.dataset.n = paraIdx;

    // Paragraph marker
    const pm = document.createElement('div');
    pm.className = 'pm';
    pm.textContent = '¶' + paraIdx;

    // Text block
    const pt = document.createElement('div');
    pt.className = 'pt';
    const glossed = glossify(line);
    pt.innerHTML = sentencify(glossed);

    // Sentence click for focus mode
    pt.querySelectorAll('.sentence').forEach(s => {
      s.addEventListener('click', e => {
        if (!focusMode) return;
        if (e.target.closest('.gw')) return;
        textPane.querySelectorAll('.sentence').forEach(x => x.classList.remove('focused'));
        s.classList.add('focused');
      });
    });

    // Margin note toggle
    const noteToggle = document.createElement('button');
    noteToggle.className = 'note-toggle';
    noteToggle.title = 'Add paragraph note';
    noteToggle.textContent = '✎';
    noteToggle.addEventListener('click', () => toggleParaNote(paraIdx, noteToggle, noteRow));

    // Note row (hidden by default)
    const noteRow = document.createElement('div');
    noteRow.className = 'para-note';
    noteRow.dataset.para = paraIdx;
    const noteTa = document.createElement('textarea');
    noteTa.placeholder = `Note for ¶${paraIdx}…`;
    noteTa.rows = 2;
    noteTa.value = paraNotes[paraIdx] || '';
    noteTa.addEventListener('input', () => {
      paraNotes[paraIdx] = noteTa.value;
      noteToggle.classList.toggle('has-note', !!noteTa.value.trim());
    });
    noteRow.appendChild(noteTa);

    if (paraNotes[paraIdx]) {
      noteToggle.classList.add('has-note');
      noteRow.classList.add('open');
    }

    row.appendChild(pm);
    row.appendChild(pt);
    row.appendChild(noteToggle);
    textPane.appendChild(row);
    textPane.appendChild(noteRow);
  });
}

function toggleParaNote(idx, btn, noteRow) {
  const isOpen = noteRow.classList.contains('open');
  noteRow.classList.toggle('open', !isOpen);
  btn.title = isOpen ? 'Add paragraph note' : 'Close note';
}

// ── GLOSSARY ─────────────────────────────────────────────────────────
function renderGloss() {
  [glossDiv, glossDivD].forEach(el => {
    el.innerHTML = '';
    const entries = Object.entries(glossary);
    if (!entries.length) {
      el.innerHTML = '<span class="gloss-empty">—</span>';
      return;
    }
    entries.forEach(([t,d]) => {
      const div = document.createElement('div');
      div.className = 'gloss-entry';
      div.innerHTML = `<span class="gloss-term">${t}</span> — <span class="gloss-def">${d}</span>`;
      el.appendChild(div);
    });
  });
}

// ── TOOLBAR ACTIONS ───────────────────────────────────────────────────
document.getElementById('erase-btn').addEventListener('click', () => {
  eraseMode = !eraseMode;
  activeVoice = null;
  document.getElementById('erase-btn').classList.toggle('on', eraseMode);
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.vtag-btn').forEach(v => v.classList.remove('on'));
  if (!eraseMode) document.querySelector(`.swatch[data-key="${activeCat}"]`)?.classList.add('on');
});

document.getElementById('focus-btn').addEventListener('click', () => {
  focusMode = !focusMode;
  document.getElementById('focus-btn').classList.toggle('on', focusMode);
  textPane.classList.toggle('focus-mode', focusMode);
  if (!focusMode) textPane.querySelectorAll('.sentence').forEach(s => s.classList.remove('focused'));
  else textPane.querySelector('.sentence')?.classList.add('focused');
});

document.getElementById('clear-btn').addEventListener('click', () => {
  // Remove highlights
  document.querySelectorAll('mark.hl').forEach(m => {
    const p = m.parentNode;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
  });
  // Remove voice tags
  document.querySelectorAll('.vt').forEach(vt => {
    const p = vt.parentNode;
    while (vt.firstChild) p.insertBefore(vt.firstChild, vt);
    p.removeChild(vt);
  });
  anns = [];
  renderLog();
});

document.getElementById('clear-notes').addEventListener('click', () => {
  document.getElementById('notes').value = '';
});
document.getElementById('clear-notes-d')?.addEventListener('click', () => {
  document.getElementById('notes-d').value = '';
});

// ── HIGHLIGHTING + VOICE TAGGING ──────────────────────────────────────
textPane.addEventListener('mouseup', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const q = sel.toString().trim();
  if (!q || eraseMode) { sel.removeAllRanges(); return; }

  if (activeVoice) {
    // Voice tag mode
    const vt = VOICE_TAGS.find(v => v.v === activeVoice);
    try {
      const range = sel.getRangeAt(0);
      const span = document.createElement('span');
      span.className = 'vt';
      span.dataset.v = vt.v;
      span.dataset.label = vt.label;
      const id = Date.now();
      span.dataset.id = id;
      range.surroundContents(span);
      span.addEventListener('click', () => { if (eraseMode) removeEl(id, span, true); });
      anns.push({ id, q: q.slice(0,60), catLabel: vt.label, color: vt.border, isVoice: true });
      renderLog();
    } catch(e) {}
  } else {
    // Highlight mode
    const cat = CATS.find(c => c.key === activeCat);
    try {
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = 'hl';
      mark.dataset.cat = cat.label;
      mark.style.background = cat.bg;
      const id = Date.now();
      mark.dataset.id = id;
      range.surroundContents(mark);
      mark.addEventListener('click', () => { if (eraseMode) removeEl(id, mark, false); });
      anns.push({ id, q: q.slice(0,60), catLabel: cat.label, color: cat.border, isVoice: false });
      renderLog();
    } catch(e) {}
  }
  sel.removeAllRanges();
});

function removeEl(id, el, isVoice) {
  const p = el.parentNode;
  while (el.firstChild) p.insertBefore(el.firstChild, el);
  p.removeChild(el);
  anns = anns.filter(a => a.id !== id);
  renderLog();
}

function renderLog() {
  [logList, logListD].forEach(el => {
    el.innerHTML = '';
    if (!anns.length) {
      el.innerHTML = '<span class="log-empty">No annotations yet.</span>';
      return;
    }
    anns.forEach(a => {
      const item = document.createElement('div');
      item.className = 'log-item';
      item.style.borderLeftColor = a.color;
      item.innerHTML = `<div class="log-q">"${a.q}${a.q.length>=60?'…':''}"</div><div class="log-c">${a.catLabel}</div>`;
      el.appendChild(item);
    });
  });
}

// ── TOOLTIP ───────────────────────────────────────────────────────────
textPane.addEventListener('mouseover', e => {
  const gw = e.target.closest('.gw');
  if (!gw) return;
  document.getElementById('tip-term').textContent = gw.dataset.term;
  document.getElementById('tip-def').textContent  = gw.dataset.def;
  tip.style.display = 'block';
});
textPane.addEventListener('mousemove', e => {
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 38) + 'px';
});
textPane.addEventListener('mouseout', e => {
  if (!e.target.closest('.gw')) tip.style.display = 'none';
});

// ── DRAWER (iframe mode) ──────────────────────────────────────────────
function setupDrawer() {
  const fab    = document.getElementById('fab');
  const drawer = document.getElementById('drawer');
  const handle = document.getElementById('drawer-handle');

  fab.addEventListener('click', () => drawer.classList.toggle('open'));
  handle.addEventListener('click', () => drawer.classList.remove('open'));

  document.querySelectorAll('.dtab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.dtab').forEach(t => t.classList.remove('on'));
      document.querySelectorAll('.drawer-panel').forEach(p => p.classList.remove('on'));
      this.classList.add('on');
      document.getElementById('dp-' + this.dataset.tab)?.classList.add('on');
    });
  });
}

// ── PNG DOWNLOAD ──────────────────────────────────────────────────────
document.getElementById('download-btn').addEventListener('click', async () => {
  const btn = document.getElementById('download-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  tip.style.display = 'none';

  const pane = document.getElementById('text-pane');
  const savedHeight   = pane.style.height;
  const savedOverflow = pane.style.overflowY;
  pane.style.height    = pane.scrollHeight + 'px';
  pane.style.overflowY = 'visible';

  try {
    const canvas = await html2canvas(document.querySelector('.app'), {
      scale: 2, useCORS: true,
      backgroundColor: '#1e1c18',
      windowWidth:  document.documentElement.scrollWidth,
      windowHeight: document.querySelector('.app').scrollHeight,
    });
    const link = document.createElement('a');
    const filename = (EXCERPT.title + ' — annotations').replace(/[^a-z0-9 —]/gi,'') + '.png';
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('Export failed. Try again.'); }

  pane.style.height    = savedHeight;
  pane.style.overflowY = savedOverflow;
  btn.textContent = 'Download PNG'; btn.disabled = false;
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
